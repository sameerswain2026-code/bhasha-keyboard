name: Production Android Build

on:
  push:
    branches:
      - feat/secure-cloud-linked-documents
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Android signing files
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEY_PROPERTIES"
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          test -s android/app/upload-keystore.jks
          test -s android/key.properties

      - run: flutter pub get
      - run: dart format .
      - run: flutter analyze
      - run: flutter test

      - name: Build signed ARM64 release APK
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --dart-define="APPWRITE_ENDPOINT=https://nyc.cloud.appwrite.io/v1"
          --dart-define="APPWRITE_PROJECT_ID=6a7fc74a001f50afe9e5"
          --dart-define="APPWRITE_DATABASE_ID=bhasha-db"
          --dart-define="APPWRITE_DOCUMENT_LINKS_COLLECTION_ID=document-links"
          --dart-define="APPWRITE_AI_GATEWAY_FUNCTION_ID=${{ vars.APPWRITE_AI_GATEWAY_FUNCTION_ID }}"
          --dart-define="APPWRITE_DRIVE_GATEWAY_FUNCTION_ID=${{ vars.APPWRITE_DRIVE_GATEWAY_FUNCTION_ID }}"

      - name: Build signed production App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define="APPWRITE_ENDPOINT=https://nyc.cloud.appwrite.io/v1"
          --dart-define="APPWRITE_PROJECT_ID=6a7fc74a001f50afe9e5"
          --dart-define="APPWRITE_DATABASE_ID=bhasha-db"
          --dart-define="APPWRITE_DOCUMENT_LINKS_COLLECTION_ID=document-links"
          --dart-define="APPWRITE_AI_GATEWAY_FUNCTION_ID=${{ vars.APPWRITE_AI_GATEWAY_FUNCTION_ID }}"
          --dart-define="APPWRITE_DRIVE_GATEWAY_FUNCTION_ID=${{ vars.APPWRITE_DRIVE_GATEWAY_FUNCTION_ID }}"

      - name: Verify signed outputs
        run: |
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: bhasha-keyboard-production-arm64
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
